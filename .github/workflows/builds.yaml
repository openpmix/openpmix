name: Build tests

on: [pull_request]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        path: ['non-vpath', 'vpath']
        sphinx: ['no-sphinx', 'sphinx']
        # 'hidden' is what users get; 'visible' is --disable-visibility.
        # test/ used to be built ONLY in the latter, so a default build
        # never compiled test/unit at all -- that gate is gone (see
        # test/Makefile.am) and both now run the suite. Keep both: the
        # export rules are what the visible build actually checks.
        visibility: ['hidden', 'visible']
        exclude:
          # visibility governs the C build and the docs axis does not
          # touch it, so one visibility-disabled build per path is
          # enough -- no need to pay for the sphinx cross as well
          - visibility: 'visible'
            sphinx: 'sphinx'
    steps:
    - name: Install dependencies
      run: brew install libevent hwloc autoconf automake libtool
    - name: Git clone OpenPMIx
      uses: actions/checkout@v6
      with:
            submodules: recursive
    - name: Build OpenPMIx
      run: |
        # Homebrew doesn't install Libevent's (or libev's) header or
        # library files into a default search location.  Shrug.  So
        # use pkg-config to get the location and explicitly pass it to
        # configure.
        libevent_cppflags=$(pkg-config libevent --cflags)
        libevent_ldflags=$(pkg-config libevent --libs | perl -pe 's/^.*(-L[^ ]+).*$/\1/')

        ./autogen.pl

        sphinx=
        if test "${{ matrix.sphinx }}" = sphinx; then
            # The macos Github Action environment gets angry at us if
            # we try to pip install into the global environment.  So
            # make a virtual environment and install sphinx into that.
            python -m venv venv
            . ./venv/bin/activate
            pip3 install -r docs/requirements.txt
            sphinx=--enable-sphinx
        fi

        visibility=
        if test "${{ matrix.visibility }}" = visible; then
            visibility=--disable-visibility
        fi

        c=./configure
        if test "${{ matrix.path }}" = vpath; then
            mkdir build
            cd build
            c=../configure
        fi

        $c --prefix=${PWD}/install $sphinx $visibility \
            CPPFLAGS=$libevent_cppflags \
            LDFLAGS=$libevent_ldflags \
            --enable-devel-check
        make -j
        make install
        cd test
        make check
        cd ..
        make uninstall

  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: ['non-vpath', 'vpath']
        sphinx: ['no-sphinx', 'sphinx']
        # see the note on the macos job
        visibility: ['hidden', 'visible']
        exclude:
          # visibility governs the C build and the docs axis does not
          # touch it, so one visibility-disabled build per path is
          # enough -- no need to pay for the sphinx cross as well
          - visibility: 'visible'
            sphinx: 'sphinx'
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends software-properties-common libhwloc-dev libevent-dev
    - name: Git clone OpenPMIx
      uses: actions/checkout@v6
      with:
            submodules: recursive
    - name: Build OpenPMIx
      run: |
        ./autogen.pl

        sphinx=
        if test "${{ matrix.sphinx }}" = sphinx; then
            pip install -r docs/requirements.txt
            sphinx=--enable-sphinx
        fi

        visibility=
        if test "${{ matrix.visibility }}" = visible; then
            visibility=--disable-visibility
        fi

        c=./configure
        if test "${{ matrix.path }}" = vpath; then
            mkdir build
            cd build
            c=../configure
        fi

        $c --prefix=${PWD}/install $sphinx $visibility --enable-devel-check
        make -j
        cd test
        make check
        cd ..
        make install
        make uninstall

  mca-dso:
    # Every component built as a run-time-loadable plugin, rather than
    # statically linked into libpmix.
    #
    # This is a configuration users really get - it is how the component
    # tree is meant to be deployed, and how a distribution can ship a
    # plugin separately from the library - but nothing in CI built it, so
    # the whole dlopen half of src/mca/base and every "what happens when
    # a component is unloaded" question went unexercised. That is how a
    # missing pmix_mca_base_framework_close() in PMIx_server_finalize
    # survived: with everything static nothing is ever unmapped, so the
    # stale module pointers it left behind were harmless, and only a DSO
    # build turned them into a segfault on the second PMIx_server_init.
    #
    # The loader axis is here for a related reason. pdl picks its
    # component at configure time and pdlopen wins wherever a native
    # dlopen exists, so plibltdl is compiled by no default build
    # anywhere - and it had rotted out of compiling entirely, unnoticed,
    # against several years of symbol renames. --disable-pmix-dlopen is
    # what makes it lose, and is the only thing that keeps the fallback
    # loader honest.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        loader: ['pdlopen', 'plibltdl']
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends software-properties-common libhwloc-dev libevent-dev libltdl-dev
    - name: Git clone OpenPMIx
      uses: actions/checkout@v6
      with:
            submodules: recursive
    - name: Build OpenPMIx with every component as a DSO
      run: |
        ./autogen.pl

        loader=
        if test "${{ matrix.loader }}" = plibltdl; then
            # make pdlopen fail its probe so the libltdl component,
            # priority 50, becomes the framework's single component
            loader=--disable-pmix-dlopen
        fi

        ./configure --prefix=${PWD}/install --enable-devel-check \
            --enable-mca-dso $loader
        make -j

        # confirm the axis actually did what it says: a static build
        # would pass the suite below without exercising any of this
        grep -q "pmix_mca_pdl_${{ matrix.loader }}_component" \
            src/mca/pdl/base/static-components.h
        test -n "$(find src/mca -name '*.so' -print -quit)"

        cd test
        make check
        cd ..
        make install
        make uninstall

  sanitizer:
    # AddressSanitizer over the unit suite.
    #
    # This exists because the tree could not be sanitizer-built at all
    # until recently: two -Werror failures that only appear at -O1 (the
    # level a sanitizer build uses) stood in the way, so nobody could
    # run one, so nothing kept it buildable. The first two runs after
    # they were fixed found a read off an empty list's sentinel and a
    # free of an uninitialized pointer - both of which had been surviving
    # on luck. Without a job here, -O1 rots again and the next person
    # pays the same bisection cost.
    runs-on: ubuntu-latest
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends software-properties-common libhwloc-dev libevent-dev
    - name: Git clone OpenPMIx
      uses: actions/checkout@v6
      with:
            submodules: recursive
    - name: Build and run the unit suite under AddressSanitizer
      env:
        # Several cases deliberately request an impossible allocation to
        # exercise the failure path. ASan aborts on that by default;
        # those tests want the NULL a real allocator would return.
        ASAN_OPTS: allocator_may_return_null=1
      run: |
        ./autogen.pl
        ./configure --prefix=${PWD}/install --enable-devel-check \
            CFLAGS="-fsanitize=address -g -O1" \
            LDFLAGS="-fsanitize=address"
        make -j

        # Leak checking is on for the three subdirectories that are
        # clean under it. They are self-contained - no server, no
        # launcher - which is what makes them able to stay clean.
        export ASAN_OPTIONS="$ASAN_OPTS:detect_leaks=1"
        make -C test/unit/class check
        make -C test/unit/util check
        make -C test/unit/mca check

        # The programs in test/unit itself run errors-only. Several are
        # run_*.pl drivers that bring up a real PMIx server and tools,
        # and that lifecycle still leaks - a few hundred records, all in
        # server/tool teardown rather than in anything the library does
        # per operation. Cleaning that up is its own piece of work; until
        # it happens, turning leak detection on here would mean a job
        # nobody can keep green. Memory *errors* are caught regardless,
        # and those are what have been biting.
        #
        # check-am, not check: check would recurse back into the three
        # subdirectories above and run them a second time, and util
        # alone takes over two minutes under ASan.
        export ASAN_OPTIONS="$ASAN_OPTS:detect_leaks=0"
        make -C test/unit check-am

  distcheck:
    runs-on: ubuntu-latest
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends software-properties-common libhwloc-dev libevent-dev python3 python3-pip
    - name: Git clone OpenPMIx
      uses: actions/checkout@v6
      with:
            submodules: recursive
    - name: Distcheck
      run: |
        pip install -r docs/requirements.txt
        ./autogen.pl
        ./configure --prefix=${PWD}/install --enable-sphinx --enable-devel-check
        make distcheck AM_DISTCHECK_MAKEFLAGS=-j
