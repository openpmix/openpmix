name: Build tests

on: [pull_request]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        path: ['non-vpath', 'vpath']
        sphinx: ['no-sphinx', 'sphinx']
        # 'hidden' is what users get; 'visible' is --disable-visibility.
        # test/ used to be built ONLY in the latter, so a default build
        # never compiled test/unit at all -- that gate is gone (see
        # test/Makefile.am) and both now run the suite. Keep both: the
        # export rules are what the visible build actually checks.
        visibility: ['hidden', 'visible']
        exclude:
          # visibility governs the C build and the docs axis does not
          # touch it, so one visibility-disabled build per path is
          # enough -- no need to pay for the sphinx cross as well
          - visibility: 'visible'
            sphinx: 'sphinx'
    steps:
    - name: Install dependencies
      run: brew install libevent hwloc autoconf automake libtool
    - name: Git clone OpenPMIx
      uses: actions/checkout@v6
      with:
            submodules: recursive
    - name: Build OpenPMIx
      run: |
        # Homebrew doesn't install Libevent's (or libev's) header or
        # library files into a default search location.  Shrug.  So
        # use pkg-config to get the location and explicitly pass it to
        # configure.
        libevent_cppflags=$(pkg-config libevent --cflags)
        libevent_ldflags=$(pkg-config libevent --libs | perl -pe 's/^.*(-L[^ ]+).*$/\1/')

        ./autogen.pl

        sphinx=
        if test "${{ matrix.sphinx }}" = sphinx; then
            # The macos Github Action environment gets angry at us if
            # we try to pip install into the global environment.  So
            # make a virtual environment and install sphinx into that.
            python -m venv venv
            . ./venv/bin/activate
            pip3 install -r docs/requirements.txt
            sphinx=--enable-sphinx
        fi

        visibility=
        if test "${{ matrix.visibility }}" = visible; then
            visibility=--disable-visibility
        fi

        c=./configure
        if test "${{ matrix.path }}" = vpath; then
            mkdir build
            cd build
            c=../configure
        fi

        $c --prefix=${PWD}/install $sphinx $visibility \
            CPPFLAGS=$libevent_cppflags \
            LDFLAGS=$libevent_ldflags \
            --enable-devel-check
        make -j
        make install
        cd test
        make check
        cd ..
        make uninstall

  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: ['non-vpath', 'vpath']
        sphinx: ['no-sphinx', 'sphinx']
        # see the note on the macos job
        visibility: ['hidden', 'visible']
        exclude:
          # visibility governs the C build and the docs axis does not
          # touch it, so one visibility-disabled build per path is
          # enough -- no need to pay for the sphinx cross as well
          - visibility: 'visible'
            sphinx: 'sphinx'
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends software-properties-common libhwloc-dev libevent-dev
    - name: Git clone OpenPMIx
      uses: actions/checkout@v6
      with:
            submodules: recursive
    - name: Build OpenPMIx
      run: |
        ./autogen.pl

        sphinx=
        if test "${{ matrix.sphinx }}" = sphinx; then
            pip install -r docs/requirements.txt
            sphinx=--enable-sphinx
        fi

        visibility=
        if test "${{ matrix.visibility }}" = visible; then
            visibility=--disable-visibility
        fi

        c=./configure
        if test "${{ matrix.path }}" = vpath; then
            mkdir build
            cd build
            c=../configure
        fi

        $c --prefix=${PWD}/install $sphinx $visibility --enable-devel-check
        make -j
        cd test
        make check
        cd ..
        make install
        make uninstall

  sanitizer:
    # AddressSanitizer over the unit suite.
    #
    # This exists because the tree could not be sanitizer-built at all
    # until recently: two -Werror failures that only appear at -O1 (the
    # level a sanitizer build uses) stood in the way, so nobody could
    # run one, so nothing kept it buildable. The first two runs after
    # they were fixed found a read off an empty list's sentinel and a
    # free of an uninitialized pointer - both of which had been surviving
    # on luck. Without a job here, -O1 rots again and the next person
    # pays the same bisection cost.
    runs-on: ubuntu-latest
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends software-properties-common libhwloc-dev libevent-dev
    - name: Git clone OpenPMIx
      uses: actions/checkout@v6
      with:
            submodules: recursive
    - name: Build and run the unit suite under AddressSanitizer
      env:
        # allocator_may_return_null: several cases deliberately request
        #   an impossible allocation to exercise the failure path. ASan
        #   aborts on that by default; these tests want the NULL that
        #   the real allocator would return.
        # detect_leaks: OFF, deliberately, and not because leaks do not
        #   matter. A handful of cases allocate through a STATIC_INIT
        #   object, whose destructor by design does not free what the
        #   object acquired, so they leak by construction. Turning leak
        #   detection on means cleaning those up first; that is worth
        #   doing and is not what this job is for. Memory *errors* -
        #   overflows, use-after-free, uninitialized reads - are caught
        #   either way, and those are what have been biting.
        ASAN_OPTIONS: allocator_may_return_null=1:detect_leaks=0
      run: |
        ./autogen.pl
        ./configure --prefix=${PWD}/install --enable-devel-check \
            CFLAGS="-fsanitize=address -g -O1" \
            LDFLAGS="-fsanitize=address"
        make -j
        # test/unit only. The server-driven run_*.pl cases under test/
        # bring up a real PMIx server in the scheduler role, which is a
        # node-wide singleton and does not belong in a job whose point
        # is memory checking; test/unit is where the library is driven
        # directly and where the value is.
        make -C test/unit check

  distcheck:
    runs-on: ubuntu-latest
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends software-properties-common libhwloc-dev libevent-dev python3 python3-pip
    - name: Git clone OpenPMIx
      uses: actions/checkout@v6
      with:
            submodules: recursive
    - name: Distcheck
      run: |
        pip install -r docs/requirements.txt
        ./autogen.pl
        ./configure --prefix=${PWD}/install --enable-sphinx --enable-devel-check
        make distcheck AM_DISTCHECK_MAKEFLAGS=-j
