name: Build tests

on: [pull_request]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        path: ['non-vpath', 'vpath']
        sphinx: ['no-sphinx', 'sphinx']
        # The test/ tree is only built when symbol visibility is
        # disabled (see test/Makefile.am: those tests reach for internal
        # symbols that PMIX_EXPORT would otherwise hide), so a build
        # that leaves visibility at its default never compiles or runs
        # any of test/unit.  Cover both: 'hidden' is what users get,
        # 'visible' is what exercises the unit tests.
        visibility: ['hidden', 'visible']
        exclude:
          # visibility governs the C build and the docs axis does not
          # touch it, so one visibility-disabled build per path is
          # enough -- no need to pay for the sphinx cross as well
          - visibility: 'visible'
            sphinx: 'sphinx'
    steps:
    - name: Install dependencies
      run: brew install libevent hwloc autoconf automake libtool
    - name: Git clone OpenPMIx
      uses: actions/checkout@v6
      with:
            submodules: recursive
    - name: Build OpenPMIx
      run: |
        # Homebrew doesn't install Libevent's (or libev's) header or
        # library files into a default search location.  Shrug.  So
        # use pkg-config to get the location and explicitly pass it to
        # configure.
        libevent_cppflags=$(pkg-config libevent --cflags)
        libevent_ldflags=$(pkg-config libevent --libs | perl -pe 's/^.*(-L[^ ]+).*$/\1/')

        ./autogen.pl

        sphinx=
        if test "${{ matrix.sphinx }}" = sphinx; then
            # The macos Github Action environment gets angry at us if
            # we try to pip install into the global environment.  So
            # make a virtual environment and install sphinx into that.
            python -m venv venv
            . ./venv/bin/activate
            pip3 install -r docs/requirements.txt
            sphinx=--enable-sphinx
        fi

        visibility=
        if test "${{ matrix.visibility }}" = visible; then
            visibility=--disable-visibility
        fi

        c=./configure
        if test "${{ matrix.path }}" = vpath; then
            mkdir build
            cd build
            c=../configure
        fi

        $c --prefix=${PWD}/install $sphinx $visibility \
            CPPFLAGS=$libevent_cppflags \
            LDFLAGS=$libevent_ldflags \
            --enable-devel-check
        make -j
        make install
        cd test
        make check
        cd ..
        make uninstall

  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: ['non-vpath', 'vpath']
        sphinx: ['no-sphinx', 'sphinx']
        # see the note on the macos job: only a visibility-disabled
        # build compiles the test/ tree at all
        visibility: ['hidden', 'visible']
        exclude:
          # visibility governs the C build and the docs axis does not
          # touch it, so one visibility-disabled build per path is
          # enough -- no need to pay for the sphinx cross as well
          - visibility: 'visible'
            sphinx: 'sphinx'
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends software-properties-common libhwloc-dev libevent-dev
    - name: Git clone OpenPMIx
      uses: actions/checkout@v6
      with:
            submodules: recursive
    - name: Build OpenPMIx
      run: |
        ./autogen.pl

        sphinx=
        if test "${{ matrix.sphinx }}" = sphinx; then
            pip install -r docs/requirements.txt
            sphinx=--enable-sphinx
        fi

        visibility=
        if test "${{ matrix.visibility }}" = visible; then
            visibility=--disable-visibility
        fi

        c=./configure
        if test "${{ matrix.path }}" = vpath; then
            mkdir build
            cd build
            c=../configure
        fi

        $c --prefix=${PWD}/install $sphinx $visibility --enable-devel-check
        make -j
        cd test
        make check
        cd ..
        make install
        make uninstall

  distcheck:
    runs-on: ubuntu-latest
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends software-properties-common libhwloc-dev libevent-dev python3 python3-pip
    - name: Git clone OpenPMIx
      uses: actions/checkout@v6
      with:
            submodules: recursive
    - name: Distcheck
      run: |
        pip install -r docs/requirements.txt
        ./autogen.pl
        ./configure --prefix=${PWD}/install --enable-sphinx --enable-devel-check
        make distcheck AM_DISTCHECK_MAKEFLAGS=-j
